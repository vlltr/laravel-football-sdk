name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            testbench: "^10.0"
          - php: "8.3"
            testbench: "^11.0"
          - php: "8.5"
            testbench: "^11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: PHP_VERSION=${{ matrix.php }} docker compose build sdk
      - name: Install
        run: docker compose run --rm sdk composer update --no-interaction --prefer-dist --with="orchestra/testbench:${{ matrix.testbench }}"
      - name: Pint
        run: docker compose run --rm sdk vendor/bin/pint --test
      - name: Test
        run: docker compose run --rm sdk vendor/bin/phpunit
